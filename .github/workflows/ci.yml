name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no everscribe dependency on main
        run: make check-clean
      - name: the guard itself still works
        run: ./scripts/check-clean-test.sh

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: cd apps/go && go build ./... && go vet ./...
      - run: cd apps/go && go test ./... -count=1

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: the harness is gofmt clean
        run: |
          unformatted=$(gofmt -l contract/conformance)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: cd contract/conformance && go vet ./...
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: apps/node unit tests
        run: make test-node
      - run: make verify
