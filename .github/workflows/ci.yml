name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no everscribe dependency on main
        run: make check-clean
      - name: the guard itself still works
        run: ./scripts/check-clean-test.sh

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: cd apps/go && go build ./... && go vet ./...
      - run: cd apps/go && go test ./... -count=1

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same channel apps/rust/Dockerfile builds with. rustup ships on the
      # runner, so no third-party action is pinned here.
      - name: pin the toolchain the Dockerfile builds with
        run: rustup toolchain install 1.96 --profile minimal && rustup default 1.96
      - run: cd apps/rust && cargo build && cargo test
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # apps/go and apps/node have no web suite to run here. apps/python
      # has one; it runs in the python job below.
      - name: apps/rust frontend DOM tests
        run: cd apps/rust/web && pnpm install --frozen-lockfile && pnpm test

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: the harness is gofmt clean
        run: |
          unformatted=$(gofmt -l contract/conformance)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: cd contract/conformance && go vet ./...
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: apps/node unit tests
        run: make test-node
      - run: make verify
