[package]
name = "ai-assisted-setup-demo-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
# The `axum` feature gates EverscribeLayer / the CurrentEvent extractor.
everscribe = { version = "0.0.0", features = ["axum"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
